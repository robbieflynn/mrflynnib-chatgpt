name: Account navigation checks
on:
  pull_request:
    paths:
      - 'src/components/account-menu.tsx'
      - 'src/components/account-navigation.css'
      - 'src/components/site-header.tsx'
      - 'src/components/mobile-navigation.tsx'
      - 'src/lib/platform-access.ts'
      - 'scripts/test-account-navigation.mjs'
      - '.github/workflows/account-navigation.yml'
permissions:
  contents: read
jobs:
  account-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run lint
      - run: node scripts/test-account-navigation.mjs
      - run: node scripts/test-access-journey.mjs
      - run: node scripts/test-igcse-navigation.mjs
      - run: npm run build -- --webpack
