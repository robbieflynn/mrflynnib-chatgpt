name: Question bank header release checks
on:
  push:
    branches: [main]
    paths:
      - 'src/app/question-bank/**'
      - 'src/components/question-bank-embed.tsx'
      - 'scripts/test-bank-header-browser.mjs'
      - '.github/workflows/bank-header-release.yml'
  pull_request:
    paths:
      - 'src/app/question-bank/**'
      - 'src/components/question-bank-embed.tsx'
      - 'scripts/test-bank-header-browser.mjs'
      - '.github/workflows/bank-header-release.yml'
permissions:
  contents: read
jobs:
  release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run verify:release
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise production build
        run: |
          npm run start > /tmp/bank-header-server.log 2>&1 &
          node scripts/test-bank-header-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-header-browser-results
          path: test-results/bank-header
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Wait for approved header deployment
        run: |
          node --input-type=module -e '
            for (let i = 0; i < 90; i++) {
              const response = await fetch("https://www.mrflynnib.com/question-bank/aa-hl", {cache:"no-store"});
              if (response.ok && (await response.text()).includes("qb-course-page-hero-compact")) process.exit(0);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error("Approved header deployment not visible after 15 minutes");
          '
      - name: Verify live public question banks
        env:
          BANK_TEST_URL: https://www.mrflynnib.com
        run: node scripts/test-bank-header-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-header-production-results
          path: test-results/bank-header
